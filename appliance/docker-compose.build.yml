# Build override for docker-compose.yml: builds the API/UI images from this
# checkout and tags them resurgam-backend:${RESURGAM_VERSION} /
# resurgam-web:${RESURGAM_VERSION} -- for a local smoke test or DEPLOY.md's
# manual install. The appliance image and update bundles build the same
# Dockerfiles (packer/scripts/provision.sh, release/build-bundle.sh).
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  backend:
    # Built from the repo root, not backend/ alone -- see the Dockerfile's
    # own comment: resurgam_api has a real runtime dependency on the
    # sibling restore-worker/ package.
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        RESURGAM_VERSION: ${RESURGAM_VERSION}
    pull_policy: build

  web:
    build:
      context: ../frontend
      args:
        RESURGAM_VERSION: ${RESURGAM_VERSION}
    pull_policy: build
