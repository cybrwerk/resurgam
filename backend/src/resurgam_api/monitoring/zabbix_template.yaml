zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
  templates:
    - uuid: dfd1c8ec6d7848b79489d2d6dbf04021
      template: 'RESURGAM by HTTP'
      name: 'RESURGAM by HTTP'
      description: |
        Monitors a RESURGAM appliance over its REST API: whether the API is up, how full each PBS
        datastore is, and the state and age of the newest backup, verify, prune, garbage collection
        and sync task per PBS instance. No agent or script on the appliance.

        Setup (RESURGAM: Administration -> Zabbix monitoring walks through it):

        1. In RESURGAM create a personal API token: role "platform_admin -- all tenants (global)",
           read-only, limited to the Zabbix server's address.
        2. Create a host for the appliance and link this template.
        3. Set the host macros {$RESURGAM.URL} (the appliance's own address, e.g.
           https://resurgam.example.com -- any other name or IP gets HTTP 421) and {$RESURGAM.TOKEN}
           (the token, as secret text).

        Thresholds: {$RESURGAM.DATASTORE.PUSED.WARN} / {$RESURGAM.DATASTORE.PUSED.CRIT} and
        {$RESURGAM.DATASTORE.FULL.DAYS.WARN} / {$RESURGAM.DATASTORE.FULL.DAYS.CRIT} (per datastore with the
        datastore name as context) and {$RESURGAM.JOB.AGE.MAX} (per task type as context).
      vendor:
        name: RESURGAM
        version: 0.3-2
      groups:
        - name: Templates/Applications
      items:
        - uuid: 2b6f0571752241d69925af9e83899176
          name: 'API readiness'
          type: HTTP_AGENT
          key: resurgam.api.readiness
          delay: 1m
          value_type: CHAR
          trends: '0'
          description: 'GET /api/v1/readiness: "ready" when the API and its database answer, "degraded" when the database does not. Needs no token.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.status
          url: '{$RESURGAM.URL}/api/v1/readiness'
          tags:
            - tag: component
              value: api
          triggers:
            - uuid: ae08bcdfba864d66805427278d9050b0
              expression: 'last(/RESURGAM by HTTP/resurgam.api.readiness)<>"ready"'
              name: 'RESURGAM: API is not ready'
              opdata: 'Status: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'The API answers, but not "ready" -- usually its database is unreachable. Check the appliance with `docker compose ps` in /opt/resurgam/appliance.'
              tags:
                - tag: scope
                  value: availability
            - uuid: c4f38cc3c336459db88e9bc5133f3eee
              expression: 'nodata(/RESURGAM by HTTP/resurgam.api.readiness,10m)=1'
              name: 'RESURGAM: API unreachable'
              priority: HIGH
              description: 'No answer from {$RESURGAM.URL}/api/v1/readiness for 10 minutes. Check that the appliance runs and that {$RESURGAM.URL} is the address set as RESURGAM_DOMAIN on the appliance (any other address is answered with HTTP 421).'
              tags:
                - tag: scope
                  value: availability
        - uuid: 08f7023e7509406db673e2d04058edb9
          name: 'Get datastore usage'
          type: HTTP_AGENT
          key: resurgam.datastores.usage
          delay: 5m
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'GET /api/v1/zabbix/datastores/usage: the latest usage of every datastore in one answer. The per-datastore items take their values from here.'
          url: '{$RESURGAM.URL}/api/v1/zabbix/datastores/usage'
          headers:
            - name: Authorization
              value: 'Bearer {$RESURGAM.TOKEN}'
          tags:
            - tag: component
              value: raw
        - uuid: 9e33f44e7021422090e6c2504e189205
          name: 'Get job status'
          type: HTTP_AGENT
          key: resurgam.jobs.status
          delay: 5m
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'GET /api/v1/zabbix/jobs/status: the newest task per PBS instance and task type in one answer. The per-job items take their values from here.'
          url: '{$RESURGAM.URL}/api/v1/zabbix/jobs/status'
          headers:
            - name: Authorization
              value: 'Bearer {$RESURGAM.TOKEN}'
          tags:
            - tag: component
              value: raw
      discovery_rules:
        - uuid: 1fb1ff7ba0ea43b0a9c43ed253a60dcc
          name: 'Datastore discovery'
          type: HTTP_AGENT
          key: resurgam.datastores.discovery
          delay: 1h
          description: 'GET /api/v1/zabbix/discovery/datastores: one entry per PBS datastore RESURGAM knows.'
          url: '{$RESURGAM.URL}/api/v1/zabbix/discovery/datastores'
          headers:
            - name: Authorization
              value: 'Bearer {$RESURGAM.TOKEN}'
          item_prototypes:
            - uuid: 0812b942f0a84fcc9396bfe009d931f1
              name: 'Datastore [{#PBS_INSTANCE_NAME}/{#DATASTORE_NAME}]: Used, in %'
              type: DEPENDENT
              key: 'resurgam.datastore.pused[{#DATASTORE_ID}]'
              delay: '0'
              value_type: FLOAT
              units: '%'
              description: 'Share of the datastore in use.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.datastores[?(@.datastore_id == ''{#DATASTORE_ID}'')].usage_percent.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: resurgam.datastores.usage
              tags:
                - tag: component
                  value: storage
                - tag: datastore
                  value: '{#DATASTORE_NAME}'
                - tag: pbs
                  value: '{#PBS_INSTANCE_NAME}'
              trigger_prototypes:
                - uuid: 7c2acb06a075495b87e80ed48c8f9bdc
                  expression: 'last(/RESURGAM by HTTP/resurgam.datastore.pused[{#DATASTORE_ID}])>{$RESURGAM.DATASTORE.PUSED.CRIT:"{#DATASTORE_NAME}"}'
                  name: 'RESURGAM: Datastore [{#PBS_INSTANCE_NAME}/{#DATASTORE_NAME}] is almost full'
                  event_name: 'RESURGAM: Datastore [{#PBS_INSTANCE_NAME}/{#DATASTORE_NAME}] is almost full (over {$RESURGAM.DATASTORE.PUSED.CRIT:"{#DATASTORE_NAME}"}%)'
                  opdata: 'Used: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: 'Backups to this datastore will fail once it is full. Prune and garbage-collect, or add space.'
                  tags:
                    - tag: scope
                      value: capacity
                - uuid: de6e111f6b3444e0b877e3dcb60646d4
                  expression: 'last(/RESURGAM by HTTP/resurgam.datastore.pused[{#DATASTORE_ID}])>{$RESURGAM.DATASTORE.PUSED.WARN:"{#DATASTORE_NAME}"}'
                  name: 'RESURGAM: Datastore [{#PBS_INSTANCE_NAME}/{#DATASTORE_NAME}] is filling up'
                  event_name: 'RESURGAM: Datastore [{#PBS_INSTANCE_NAME}/{#DATASTORE_NAME}] is filling up (over {$RESURGAM.DATASTORE.PUSED.WARN:"{#DATASTORE_NAME}"}%)'
                  opdata: 'Used: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'Plan pruning or more space before the datastore is full.'
                  dependencies:
                    - name: 'RESURGAM: Datastore [{#PBS_INSTANCE_NAME}/{#DATASTORE_NAME}] is almost full'
                      expression: 'last(/RESURGAM by HTTP/resurgam.datastore.pused[{#DATASTORE_ID}])>{$RESURGAM.DATASTORE.PUSED.CRIT:"{#DATASTORE_NAME}"}'
                  tags:
                    - tag: scope
                      value: capacity
            - uuid: db855378c3b547469eec1798683cde19
              name: 'Datastore [{#PBS_INSTANCE_NAME}/{#DATASTORE_NAME}]: Used'
              type: DEPENDENT
              key: 'resurgam.datastore.used[{#DATASTORE_ID}]'
              delay: '0'
              units: B
              description: 'Bytes in use.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.datastores[?(@.datastore_id == ''{#DATASTORE_ID}'')].used_bytes.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: resurgam.datastores.usage
              tags:
                - tag: component
                  value: storage
                - tag: datastore
                  value: '{#DATASTORE_NAME}'
                - tag: pbs
                  value: '{#PBS_INSTANCE_NAME}'
            - uuid: 5221f8070f4c49f0b59af49bf3296ca4
              name: 'Datastore [{#PBS_INSTANCE_NAME}/{#DATASTORE_NAME}]: Available'
              type: DEPENDENT
              key: 'resurgam.datastore.available[{#DATASTORE_ID}]'
              delay: '0'
              units: B
              description: 'Bytes still free.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.datastores[?(@.datastore_id == ''{#DATASTORE_ID}'')].available_bytes.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: resurgam.datastores.usage
              tags:
                - tag: component
                  value: storage
                - tag: datastore
                  value: '{#DATASTORE_NAME}'
                - tag: pbs
                  value: '{#PBS_INSTANCE_NAME}'
            - uuid: a7650a8ada454e3da2d5c402dde2f602
              name: 'Datastore [{#PBS_INSTANCE_NAME}/{#DATASTORE_NAME}]: Total size'
              type: DEPENDENT
              key: 'resurgam.datastore.total[{#DATASTORE_ID}]'
              delay: '0'
              units: B
              description: 'Total size of the datastore.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.datastores[?(@.datastore_id == ''{#DATASTORE_ID}'')].total_bytes.first()'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: resurgam.datastores.usage
              tags:
                - tag: component
                  value: storage
                - tag: datastore
                  value: '{#DATASTORE_NAME}'
                - tag: pbs
                  value: '{#PBS_INSTANCE_NAME}'
            - uuid: 569760b0b4d4495ab56743fc8857469f
              name: 'Datastore [{#PBS_INSTANCE_NAME}/{#DATASTORE_NAME}]: Time since last measurement'
              type: DEPENDENT
              key: 'resurgam.datastore.age[{#DATASTORE_ID}]'
              delay: '0'
              value_type: FLOAT
              units: s
              description: 'How long ago RESURGAM last measured this datastore. Grows when RESURGAM cannot reach the PBS.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.datastores[?(@.datastore_id == ''{#DATASTORE_ID}'')].age_seconds.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: resurgam.datastores.usage
              tags:
                - tag: component
                  value: storage
                - tag: datastore
                  value: '{#DATASTORE_NAME}'
                - tag: pbs
                  value: '{#PBS_INSTANCE_NAME}'
              trigger_prototypes:
                - uuid: d83a31474c9a4d0bb5b56d13af07f096
                  expression: 'last(/RESURGAM by HTTP/resurgam.datastore.age[{#DATASTORE_ID}])>{$RESURGAM.DATA.AGE.MAX}'
                  name: 'RESURGAM: Datastore [{#PBS_INSTANCE_NAME}/{#DATASTORE_NAME}] not measured for a while'
                  opdata: 'Last measured: {ITEM.LASTVALUE1} ago'
                  priority: AVERAGE
                  description: 'RESURGAM has not read this datastore''s usage recently -- it probably cannot reach the PBS. Check Infrastructure -> PBS in RESURGAM.'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 70f7c00897e2446492be9ef39efcb226
              name: 'Datastore [{#PBS_INSTANCE_NAME}/{#DATASTORE_NAME}]: Net growth per day'
              type: DEPENDENT
              key: 'resurgam.datastore.growth[{#DATASTORE_ID}]'
              delay: '0'
              units: B
              description: 'Net growth of used space per day over the last 30 days, after prune and garbage collection. Negative when the datastore shrinks. No value during the first 7 days.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.datastores[?(@.datastore_id == ''{#DATASTORE_ID}'')].growth_bytes_per_day.first()'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: resurgam.datastores.usage
              tags:
                - tag: component
                  value: storage
                - tag: datastore
                  value: '{#DATASTORE_NAME}'
                - tag: pbs
                  value: '{#PBS_INSTANCE_NAME}'
            - uuid: 6e3d9755409748f08e79c064fe552557
              name: 'Datastore [{#PBS_INSTANCE_NAME}/{#DATASTORE_NAME}]: Full in (days)'
              type: DEPENDENT
              key: 'resurgam.datastore.full_in[{#DATASTORE_ID}]'
              delay: '0'
              value_type: FLOAT
              units: days
              description: 'Days until the datastore is full at its net growth of the last 30 days. -1 when it is not growing or has fewer than 7 days of history.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.datastores[?(@.datastore_id == ''{#DATASTORE_ID}'')].days_until_full.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: resurgam.datastores.usage
              tags:
                - tag: component
                  value: storage
                - tag: datastore
                  value: '{#DATASTORE_NAME}'
                - tag: pbs
                  value: '{#PBS_INSTANCE_NAME}'
              trigger_prototypes:
                - uuid: 212b958d951746b59f27b0196da47c53
                  expression: 'last(/RESURGAM by HTTP/resurgam.datastore.full_in[{#DATASTORE_ID}])>=0 and last(/RESURGAM by HTTP/resurgam.datastore.full_in[{#DATASTORE_ID}])<={$RESURGAM.DATASTORE.FULL.DAYS.CRIT:"{#DATASTORE_NAME}"}'
                  name: 'RESURGAM: Datastore [{#PBS_INSTANCE_NAME}/{#DATASTORE_NAME}] will be full soon'
                  event_name: 'RESURGAM: Datastore [{#PBS_INSTANCE_NAME}/{#DATASTORE_NAME}] will be full in {ITEM.LASTVALUE1}'
                  opdata: 'Full in: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: 'At the net growth of the last 30 days the datastore is full within {$RESURGAM.DATASTORE.FULL.DAYS.CRIT:"{#DATASTORE_NAME}"} days. Shorten retention, garbage-collect or add space. RESURGAM -> Reporting -> Capacity & Trends shows the forecast.'
                  tags:
                    - tag: scope
                      value: capacity
                - uuid: eb202a345bf1470097c2b049595450a2
                  expression: 'last(/RESURGAM by HTTP/resurgam.datastore.full_in[{#DATASTORE_ID}])>=0 and last(/RESURGAM by HTTP/resurgam.datastore.full_in[{#DATASTORE_ID}])<={$RESURGAM.DATASTORE.FULL.DAYS.WARN:"{#DATASTORE_NAME}"}'
                  name: 'RESURGAM: Datastore [{#PBS_INSTANCE_NAME}/{#DATASTORE_NAME}] will be full within weeks'
                  event_name: 'RESURGAM: Datastore [{#PBS_INSTANCE_NAME}/{#DATASTORE_NAME}] will be full in {ITEM.LASTVALUE1}'
                  opdata: 'Full in: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'At the net growth of the last 30 days the datastore is full within {$RESURGAM.DATASTORE.FULL.DAYS.WARN:"{#DATASTORE_NAME}"} days. Plan retention or more space.'
                  dependencies:
                    - name: 'RESURGAM: Datastore [{#PBS_INSTANCE_NAME}/{#DATASTORE_NAME}] will be full soon'
                      expression: 'last(/RESURGAM by HTTP/resurgam.datastore.full_in[{#DATASTORE_ID}])>=0 and last(/RESURGAM by HTTP/resurgam.datastore.full_in[{#DATASTORE_ID}])<={$RESURGAM.DATASTORE.FULL.DAYS.CRIT:"{#DATASTORE_NAME}"}'
                  tags:
                    - tag: scope
                      value: capacity
        - uuid: 89350c947cba4af49b799a0c88335975
          name: 'Job discovery'
          type: HTTP_AGENT
          key: resurgam.jobs.discovery
          delay: 1h
          description: 'GET /api/v1/zabbix/discovery/jobs: one entry per PBS instance and task type that has run at least once.'
          url: '{$RESURGAM.URL}/api/v1/zabbix/discovery/jobs'
          headers:
            - name: Authorization
              value: 'Bearer {$RESURGAM.TOKEN}'
          filter:
            conditions:
              - macro: '{#TASK_TYPE}'
                value: '{$RESURGAM.JOB.TYPE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: A
          item_prototypes:
            - uuid: f90ccba7ebca4b86bd676ddf572a9293
              name: 'Job [{#PBS_INSTANCE_NAME}/{#TASK_TYPE}]: Last status'
              type: DEPENDENT
              key: 'resurgam.job.status[{#PBS_INSTANCE_ID},{#TASK_TYPE}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              description: 'Status of the newest task of this type: ok, error, running or unknown.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.jobs[?(@.pbs_instance_id == ''{#PBS_INSTANCE_ID}'' && @.task_type == ''{#TASK_TYPE}'')].status.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: resurgam.jobs.status
              tags:
                - tag: component
                  value: jobs
                - tag: pbs
                  value: '{#PBS_INSTANCE_NAME}'
                - tag: task
                  value: '{#TASK_TYPE}'
              trigger_prototypes:
                - uuid: 253034e209bc474e97e1d92c30d86639
                  expression: 'last(/RESURGAM by HTTP/resurgam.job.status[{#PBS_INSTANCE_ID},{#TASK_TYPE}])="error"'
                  name: 'RESURGAM: Last {#TASK_TYPE} task on {#PBS_INSTANCE_NAME} failed'
                  priority: AVERAGE
                  description: 'The newest {#TASK_TYPE} task on this PBS ended with an error. RESURGAM -> Jobs shows the task and its log.'
                  tags:
                    - tag: scope
                      value: notice
            - uuid: 4537c1ad5e2f45d1a6aa0c6b6d9c30d2
              name: 'Job [{#PBS_INSTANCE_NAME}/{#TASK_TYPE}]: Time since last start'
              type: DEPENDENT
              key: 'resurgam.job.age[{#PBS_INSTANCE_ID},{#TASK_TYPE}]'
              delay: '0'
              value_type: FLOAT
              units: s
              description: 'How long ago the newest task of this type started.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.jobs[?(@.pbs_instance_id == ''{#PBS_INSTANCE_ID}'' && @.task_type == ''{#TASK_TYPE}'')].age_seconds.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: resurgam.jobs.status
              tags:
                - tag: component
                  value: jobs
                - tag: pbs
                  value: '{#PBS_INSTANCE_NAME}'
                - tag: task
                  value: '{#TASK_TYPE}'
              trigger_prototypes:
                - uuid: bdef995c91924bc3866c11e95eff884e
                  expression: 'last(/RESURGAM by HTTP/resurgam.job.age[{#PBS_INSTANCE_ID},{#TASK_TYPE}])>{$RESURGAM.JOB.AGE.MAX:"{#TASK_TYPE}"}'
                  name: 'RESURGAM: No {#TASK_TYPE} task on {#PBS_INSTANCE_NAME} for too long'
                  opdata: 'Last started: {ITEM.LASTVALUE1} ago'
                  priority: WARNING
                  description: 'No {#TASK_TYPE} task has started on this PBS for longer than {$RESURGAM.JOB.AGE.MAX:"{#TASK_TYPE}"} seconds. Check the schedule in RESURGAM -> Jobs or on the PBS.'
                  tags:
                    - tag: scope
                      value: notice
      tags:
        - tag: class
          value: software
        - tag: target
          value: resurgam
      macros:
        - macro: '{$RESURGAM.DATA.AGE.MAX}'
          value: '3600'
          description: 'Seconds without a new datastore measurement before the "not measured" trigger fires.'
        - macro: '{$RESURGAM.DATASTORE.PUSED.CRIT}'
          value: '90'
          description: 'Datastore use in % for the "almost full" trigger. Set per datastore with its name as context, e.g. {$RESURGAM.DATASTORE.PUSED.CRIT:"store1"}.'
        - macro: '{$RESURGAM.DATASTORE.PUSED.WARN}'
          value: '80'
          description: 'Datastore use in % for the "filling up" trigger. Set per datastore with its name as context.'
        - macro: '{$RESURGAM.DATASTORE.FULL.DAYS.CRIT}'
          value: '14'
          description: 'Days until full (at the last 30 days'' net growth) for the "will be full soon" trigger. Set per datastore with its name as context.'
        - macro: '{$RESURGAM.DATASTORE.FULL.DAYS.WARN}'
          value: '30'
          description: 'Days until full for the "will be full within weeks" trigger. Set per datastore with its name as context.'
        - macro: '{$RESURGAM.JOB.AGE.MAX}'
          value: '93600'
          description: 'Seconds since the newest task of a type started before the "for too long" trigger fires (default 26 h, fits a daily schedule). Set per task type with the type as context.'
        - macro: '{$RESURGAM.JOB.AGE.MAX:"garbage_collection"}'
          value: '691200'
          description: 'Garbage collection usually runs weekly: 8 days.'
        - macro: '{$RESURGAM.JOB.AGE.MAX:"verify"}'
          value: '691200'
          description: 'Verify jobs usually run weekly: 8 days.'
        - macro: '{$RESURGAM.JOB.TYPE.NOT_MATCHES}'
          value: ^unknown$
          description: 'Task types not to monitor (regular expression). PBS tasks RESURGAM cannot classify are "unknown".'
        - macro: '{$RESURGAM.TOKEN}'
          type: SECRET_TEXT
          description: 'A RESURGAM API token (rsg_...): role platform_admin for all tenants, read-only, limited to the Zabbix server''s address.'
        - macro: '{$RESURGAM.URL}'
          value: 'https://resurgam.example.com'
          description: 'The appliance''s own address (RESURGAM_DOMAIN), without a trailing slash. Any other name or IP is answered with HTTP 421.'
